<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./tabela.css">

    <!--<script src="./script.js" defer></script> "defer" faz para seguir a ordem correta, classe vem depois das funções -->
    <script src="./Aluno.js" defer></script>
    <script src="./Turma.js" defer></script>
    <script src="./Interface.js" defer></script>
    <script src="./main.js" defer></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Escolar</title>
  </head>

  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button class="tab-button active" id="btn-turma" onclick="Interface.turma()">Criar Turma</button>
      <button class="tab-button" id="btn-cadastrar" onclick="Interface.cadastrar()">Cadastrar Aluno</button>
      <button class="tab-button" id="btn-listar" onclick="listar()">Listar Alunos</button>
    </div>

    <!-- Conteúdo da Aba 1: Criar Turma -->
    <div id="tab-turma" class="tab-content active">
      Professor: <input id="professor" type="text">
      Curso: <input id="curso" type="text">
      <button onclick="salvarTurma()" class="btn-salvar">Salvar Turma</button>

      <div id="lista-turmas"></div>
    </div>

    <!-- Conteúdo da Aba 2: Cadastrar Aluno -->
    <div id="tab-cadastrar" class="tab-content">
      Turma:
      <select id="turma-aluno">
        <option value="">Nenhuma turma cadastrada</option>
      </select>
      Nome: <input id="nome" type="text">
      <!--"oninput" é um comando do "js" utilizado no "html", ent precisa do ";"-->
      <!--"oninput" ele faz alterações de texto, quando o usuario terminar de digitar-->
      Nota 1: <input id="n1" type="number" step="2" oninput="if(this.value > 10 || this.value < 0) this.value = ''; "min="0" max="10">
      Nota 2: <input id="n2" type="number" step="2" oninput="if(this.value > 10 || this.value < 0) this.value = ''; " min="0" max="10">
      Nota 3: <input id="n3" type="number" step="2" oninput="if(this.value > 10 || this.value < 0) this.value = ''; " min="0" max="10">
      <button onclick="salvar()" class="btn-salvar">Salvar Aluno</button>
    </div>

    <!-- Conteúdo da Aba 3: Listar -->
    <div id="tab-listar" class="tab-content">
      Turma:
      <!-- "onchange" chama o listar de novo quando trocar a turma -->
      <select id="turma-lista" onchange="listar()">
        <option value="">Nenhuma turma cadastrada</option>
      </select>

      <h3>Alunos Cadastrados</h3>
      <div id="info-turma"></div>

      <div id="lista-alunos"></div>

    </div>
  </body>

</html>
